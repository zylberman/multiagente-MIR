[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mir-multiagent"
version = "0.1.0"
description = "Minimal multi-agent pipeline for explaining MIR study questions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
groq = ["groq>=0.30,<1"]
local = ["openai>=1.75,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
mir-multiagent = "mir_multiagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mir_multiagent.resources" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
